name: Review content updates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
concurrency:
  group: content-review
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: var/ingest/
          key: content-review-${{ github.run_id }}
          restore-keys: content-review-
      - name: Collect a bounded batch
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          INGEST_BATCH_LIMIT: '10'
          AI_BUDGET_USD: '0'
          SOURCE_REF: main
        run: |
          npm run ingest
          npm run enrich
          npm run translate -- --dry-run
          npm run content:diff
      # GITHUB_TOKEN-created PRs may not trigger another workflow: validate here.
      - name: Validate current publication and proposed records
        run: |
          npm run validate:data
          npm run check
          npm test
          npm run build
          npm run scan:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-review
          path: |
            var/ingest/repository-review.json
            var/ingest/generation-results.json
            var/ingest/review.json
            reports/content-diff.json
          retention-days: 14
      - name: Propose a review report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c codex/content-review-${{ github.run_id }}
          git add reports/content-diff.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare content review report"
          git push origin HEAD
          gh pr create --title "Review candidate content updates" --body-file .github/content-review-body.md
